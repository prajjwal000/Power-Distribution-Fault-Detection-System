services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./generator", "--seed-db", "--export-csv", "--pole-count", "3000"]
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./api"]
    ports:
      - "8080:8080"
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      - API_PORT=8080
      - SIMULATOR_URL=http://simulator:8081
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./simulator"]
    ports:
      - "8081:8081"
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      - SIM_PORT=8081
      - API_URL=http://api:8080
      - CLOCK_MULTIPLIER=30
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
