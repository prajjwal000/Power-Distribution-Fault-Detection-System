services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed-final
    command: ["./generator", "--seed-db", "--export-csv", "--pole-count", "3000"]
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-final
    command: ["./api"]
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      - API_PORT=8080
      - SIMULATOR_URL=http://simulator:8081
    depends_on:
      seed:
        condition: service_completed_successfully

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
      target: simulator-final
    command: ["./simulator"]
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      - SIM_PORT=8081
      - API_URL=http://api:8080
      - CLOCK_MULTIPLIER=30
    depends_on:
      seed:
        condition: service_completed_successfully
      api:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_started
      simulator:
        condition: service_started

volumes:
  pgdata: